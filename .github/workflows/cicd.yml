name: TimeCheck CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/timecheck-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/timecheck-frontend:latest \
            ./frontend

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.ECR_REGISTRY }}/timecheck-backend:latest

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.ECR_REGISTRY }}/timecheck-frontend:latest
